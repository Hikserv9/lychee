<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniMind Studio | Spatial Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0B0B0F',
                        'neon-green': '#CCFF00',
                        'electric-cyan': '#00F0FF',
                        'ai-violet': '#A855F7',
                    },
                    fontFamily: {
                        'sci-fi': ['Orbitron', 'sans-serif'],
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        float: 'float 6s ease-in-out infinite',
                        'pulse-orb': 'pulse-orb 3s ease-in-out infinite alternate',
                        'pulse-holo': 'pulse-holo 4s infinite ease-in-out',
                        wave: 'wave 1s infinite ease-in-out',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        'pulse-orb': {
                            '0%': { transform: 'scale(0.98)', opacity: '0.85' },
                            '100%': { transform: 'scale(1.02)', opacity: '1' },
                        },
                        'pulse-holo': {
                            '0%, 100%': { transform: 'scale(1)', opacity: '0.8' },
                            '50%': { transform: 'scale(1.05)', opacity: '1' },
                        },
                        wave: {
                            '0%, 100%': { height: '8px' },
                            '50%': { height: '22px' },
                        },
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-obsidian text-white font-sans overflow-x-hidden min-h-screen flex flex-col items-center justify-center relative px-6 pt-24">
    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/[0.03] backdrop-blur-[12px] border border-white/[0.08] hover:border-electric-cyan/30 px-8 py-4 flex justify-between items-center transition-colors">
        <div class="font-sci-fi text-xl font-bold tracking-widest bg-gradient-to-br from-neon-green to-electric-cyan bg-clip-text text-transparent">OMNIMIND</div>
        <div class="flex space-x-8 items-center">
            <a href="index.html" class="relative transition-colors duration-200 text-electric-cyan hover:text-electric-cyan [text-shadow:0_0_10px_rgba(0,240,255,0.6)] font-medium text-sm uppercase tracking-widest">Home</a>
            <a href="products.html" class="relative transition-colors duration-200 hover:text-electric-cyan font-medium text-sm uppercase tracking-widest">Marketplace</a>
            <a href="dashboard.html" class="relative transition-colors duration-200 hover:text-electric-cyan font-medium text-sm uppercase tracking-widest">Dashboard</a>
        </div>
    </nav>

    <!-- AI Voice Assistant Widget -->
    <div class="absolute top-28 right-8 flex items-center space-x-4 bg-white/[0.03] backdrop-blur-[12px] p-3 rounded-full border border-electric-cyan/30 z-20">
        <div class="flex items-end space-x-1 h-6 px-2">
            <div class="w-[3px] bg-electric-cyan animate-wave" style="animation-delay: 0.1s"></div>
            <div class="w-[3px] bg-electric-cyan animate-wave" style="animation-delay: 0.2s"></div>
            <div class="w-[3px] bg-electric-cyan animate-wave" style="animation-delay: 0.3s"></div>
            <div class="w-[3px] bg-electric-cyan animate-wave" style="animation-delay: 0.4s"></div>
        </div>
        <div class="text-[10px] font-sci-fi uppercase tracking-widest text-electric-cyan pr-4">AI Active</div>
    </div>

    <!-- Main Content -->
    <main class="max-w-6xl w-full text-center z-10">
        <h1 class="font-sci-fi text-6xl md:text-8xl font-bold tracking-tighter mb-6 leading-none">
            THE FUTURE OF <br>
            <span class="bg-gradient-to-br from-neon-green to-electric-cyan bg-clip-text text-transparent">WEB IS SPATIAL</span>
        </h1>

        <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto mb-12 font-light">
            Build immersive 3D ecosystems with the world's most advanced spatial web engine. 
            Experience reality, redefined.
        </p>

        <div class="flex flex-col md:flex-row items-center justify-center gap-6 mb-20">
            <a href="products.html" class="bg-neon-green text-black font-bold py-4 px-10 rounded-full shadow-[0_0_25px_rgba(204,255,0,0.35)] hover:scale-105 transition-transform backdrop-blur-[12px] border-t border-white/20">
                GET STARTED
            </a>
            <a href="products.html" class="border border-white/20 hover:border-electric-cyan text-white py-4 px-10 rounded-full transition-colors font-medium">
                VIEW SHOWCASE
            </a>
        </div>

        <div class="relative w-80 h-80 mx-auto">
            <div class="bg-[radial-gradient(circle,rgba(0,240,255,0.2)_0%,rgba(204,255,0,0.1)_50%,transparent_70%)] border border-electric-cyan/30 rounded-full animate-pulse-holo absolute inset-0 flex items-center justify-center">
                <div class="w-64 h-64 bg-white/[0.03] backdrop-blur-[12px] border border-white/10 rounded-full flex items-center justify-center">
                    <div class="w-48 h-48 border border-electric-cyan/20 rounded-full animate-spin" style="animation-duration: 8s;"></div>
                </div>
            </div>
            <div class="absolute inset-0 blur-3xl bg-electric-cyan/10 rounded-full"></div>
        </div>
    </main>

    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-neon-green/5 blur-[120px] rounded-full"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-electric-cyan/5 blur-[120px] rounded-full"></div>
</body>
</html>
