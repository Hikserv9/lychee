<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniMind Studio | Personalization Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- Navbar -->
    <nav class="glass px-8 py-4 flex justify-between items-center z-50">
        <div class="font-sci-fi text-xl font-bold tracking-widest text-gradient-cyan-lime">OMNIMIND</div>
        <div class="flex space-x-8 items-center">
            <a href="index.html" class="nav-link font-medium text-sm uppercase tracking-widest">Home</a>
            <a href="products.html" class="nav-link font-medium text-sm uppercase tracking-widest">Marketplace</a>
            <a href="dashboard.html" class="nav-link nav-active font-medium text-sm uppercase tracking-widest">Dashboard</a>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-20 lg:w-64 glass flex flex-col justify-between p-4 border-r border-white/5">
            <div class="space-y-8">
                <nav class="space-y-4">
                    <a href="#" class="flex items-center space-x-3 p-3 rounded-xl bg-[#00F0FF]/10 text-[#00F0FF] border border-[#00F0FF]/20">
                        <span>⚡</span><span class="hidden lg:inline text-sm font-medium">Personalization</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-white/5 text-gray-400 transition-colors">
                        <span>⚙️</span><span class="hidden lg:inline text-sm font-medium">System</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8 grid grid-cols-1 lg:grid-cols-3 gap-8 overflow-y-auto">
            <!-- AI Companion Visualizer -->
            <section class="lg:col-span-2 glass rounded-3xl p-8 flex flex-col items-center justify-center relative overflow-hidden min-h-[400px]">
                <div class="absolute top-6 left-6 text-xs text-gray-400 tracking-widest uppercase">AI Companion Visualizer</div>
                <div class="w-64 h-64 rounded-full orb flex items-center justify-center">
                    <div class="w-48 h-48 rounded-full border border-white/20 animate-spin" style="animation-duration: 15s;"></div>
                </div>
                <div class="mt-8 text-center">
                    <div class="text-sm text-[#00F0FF]">Companion Status: Optimal</div>
                    <div class="text-xs text-gray-500 mt-1">Latency: 12ms</div>
                </div>
            </section>

            <!-- Control Panel -->
            <section class="space-y-6">
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-xs font-semibold text-gray-400 mb-4 tracking-wider uppercase">System Latency</h3>
                    <div class="flex items-end gap-1 h-12">
                        <div class="bg-[#00F0FF]/40 w-1/5 h-[40%] rounded-t"></div>
                        <div class="bg-[#00F0FF]/60 w-1/5 h-[70%] rounded-t"></div>
                        <div class="bg-[#00F0FF] w-1/5 h-[100%] rounded-t"></div>
                        <div class="bg-[#00F0FF]/50 w-1/5 h-[50%] rounded-t"></div>
                        <div class="bg-[#00F0FF]/80 w-1/5 h-[80%] rounded-t"></div>
                    </div>
                </div>

                <div class="glass p-6 rounded-2xl space-y-4">
                    <h3 class="text-xs font-semibold text-gray-400 tracking-wider uppercase">Generative UI Theme</h3>
                    <div class="space-y-2">
                        <label class="flex items-center justify-between p-3 rounded-xl border border-[#00F0FF]/30 bg-[#00F0FF]/5 cursor-pointer">
                            <span class="text-sm font-medium">Cyberpunk</span>
                            <input type="radio" name="theme" checked class="accent-[#00F0FF]">
                        </label>
                        <label class="flex items-center justify-between p-3 rounded-xl border border-white/5 hover:bg-white/5 cursor-pointer transition-colors">
                            <span class="text-sm font-medium">Minimalist</span>
                            <input type="radio" name="theme" class="accent-[#00F0FF]">
                        </label>
                        <label class="flex items-center justify-between p-3 rounded-xl border border-white/5 hover:bg-white/5 cursor-pointer transition-colors">
                            <span class="text-sm font-medium">Professional</span>
                            <input type="radio" name="theme" class="accent-[#00F0FF]">
                        </label>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
